[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "frameforge"
version = "0.1.0"
description = "Frame Forge - AI-powered universal autonomous game-playing and game-QA system for Windows"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary - owner use only" }
authors = [{ name = "Frame Forge" }]

# CORE dependency floor. Everything else is an optional extra with graceful absence.
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "structlog>=24.4",
    "mss>=9.0",
    "numpy>=2.0",
    "opencv-python>=4.10",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
# Accelerated capture. Optional: mss is the default so nothing is ever blocked on DXGI.
dxgi = ["dxcam>=0.0.5"]
# OCR. WinRT (winsdk) is primary: OS-provided, offline, no model download.
# rapidocr is the fallback for stylized game fonts.
ocr = ["winsdk>=1.0.0b10"]
ocr_fallback = ["rapidocr-onnxruntime>=1.3"]
# Control API for the future dashboard / remote executor.
api = ["fastapi>=0.115", "uvicorn[standard]>=0.32"]
# Deterministic seed RNG helpers (stdlib is sufficient; kept explicit for clarity).
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
]
all = [
    "dxcam>=0.0.5",
    "winsdk>=1.0.0b10",
    "rapidocr-onnxruntime>=1.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
frameforge = "frameforge.cli.main:main"

[project.urls]
Documentation = "https://example.invalid/frameforge/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/frameforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "hardware: requires a real Windows desktop session, real display and real input (hardware-in-the-loop)",
    "slow: long-running",
]
addopts = "-ra --strict-markers"
filterwarnings = ["error::DeprecationWarning:frameforge.*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "RUF"]
ignore = ["ANN401"]